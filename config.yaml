# =============================================================================
# Weights & Biases
# =============================================================================
wandb:
  entity: TestRedRl
  project: Red_skill
  group: ~
  base_url: https://api.wandb.ai


# =============================================================================
# Environment (RedGymEnv)
# =============================================================================
env:
  # --- Runtime ---
  headless: true
  disable_ai_actions: false          # true: 에이전트 입력 끔 (디버그)
  animate_scripts: false             # 스크립트 연출 (obs에는 미포함)
  action_freq: 24                    # 환경 1 step당 에뮬 tick 수
  max_steps: 8000
  log_frequency: 2000

  # --- Init / state ---
  state_dir: pyboy_states
  init_state: training3
  save_state: true                   # info에 PyBoy save state 포함
  perfect_ivs: false
  infinite_money: true
  infinite_health: false

  # --- Observation ---
  reduce_res: true
  two_bit: false
  use_global_map: false
  include_screen_obs: true           # false: screen=0, CNN 생략 (타일·메뉴·파티 중심)
  exploration_inc: 1.0
  exploration_max: 1.0
  map_id_scalefactor: 9.539340019226074
  max_steps_scaling: 0               # required 진행에 따라 max_steps 스케일 (0=끔)

  # --- Video ---
  save_video: true
  fast_video: true
  video_dir: video
  n_record: 3
  video_tail_steps: 2500             # 에피소드 끝 N step만 MP4에 기록

  # --- Wild / QoL ---
  disable_wild_encounters: false
  auto_flash: false
  auto_remove_all_nonuseful_items: true
  auto_next_elevator_floor: false
  insert_saffron_guard_drinks: false

  # --- HM: teach / auto-use ---
  auto_teach_cut: false
  auto_use_cut: false
  auto_teach_surf: false
  auto_use_surf: false              # true면 방향키로 인접 물 향할 때 환경이 Surf 매크로 실행 (학습 우회)
  auto_teach_strength: false
  auto_use_strength: false
  auto_solve_strength_puzzles: false

  # --- Multi-agent sync ---
  required_tolerance: null           # 마일스톤 동기화 허용 비율 (null=끔)


# =============================================================================
# Training (CleanPuffeRL / PPO)
# =============================================================================
train:
  seed: 1
  torch_deterministic: true
  verbose: true
  data_dir: runs

  # --- Device (auto_device=true면 cpu/cuda 프로필이 아래 기본값을 덮음) ---
  auto_device: true
  device: auto                       # auto_device=false일 때만 사용
  cpu:
    device: cpu
    num_envs: 96
    num_workers: 8
    env_batch_size: 36
    zero_copy: false
  cuda:
    device: cuda
    num_envs: 384
    num_workers: 32
    env_batch_size: 36
    zero_copy: false
    cudnn_benchmark: null
    cudnn_deterministic: null
    matmul_allow_tf32: null
    cudnn_allow_tf32: null
  # auto_device=false 또는 프로필 미적용 시 사용
  num_envs: 192
  num_workers: 32
  env_batch_size: 36
  zero_copy: false
  env_pool: true
  cpu_offload: false

  # --- Torch compile ---
  compile: true
  compile_mode: reduce-overhead
  float32_matmul_precision: high

  # --- Rollout / batch ---
  total_timesteps: 10_000_000_000
  batch_size: 65536
  minibatch_size: 2048
  num_minibatches: 4                 # unused
  batch_rows: 128                    # unused
  bptt_horizon: 16
  update_epochs: 4

  # --- PPO ---
  learning_rate: 0.0003
  anneal_lr: false
  gamma: 0.99
  gae_lambda: 0.92
  norm_adv: true
  adv_scale: 1.2
  clip_coef: 0.2
  clip_vloss: true
  vf_coef: 0.7
  vf_clip_coef: 0.1
  ent_coef: 0.028
  max_grad_norm: 0.5
  target_kl: 0.02

  # --- Network ---
  use_rnn: true

  # --- Checkpoint ---
  save_checkpoint: false
  checkpoint_interval: 200

  # --- Swarm / reset wrappers ---
  async_wrapper: false
  sqlite_wrapper: true
  archive_states: false
  swarm: true
  required_rate: false
  early_stop: {}
  one_epoch: []

  # --- HM classification head (보조 CE; 라벨 obs hm_aux_label) ---
  hm_head:
    aux_ce: 0.01                     # 낮을수록 actor gradient 덜 잠식
    none_ce: 0.0
    label_smoothing: 0.0
    entropy_bonus: 0.01


# =============================================================================
# Wrappers (train CLI에서 선택)
# =============================================================================
wrappers:
  empty:
    - episode_stats.EpisodeStatsWrapper: {}

  baseline:
    - exploration.DecayWrapper:
        step_forgetting_factor:
          npc: 0.995
          coords: 0.9995
          map_ids: 0.995
          explore: 0.9995
          start_menu: 0.998
          pokemon_menu: 0.998
          stats_menu: 0.998
          bag_menu: 0.998
          action_bag_menu: 0.998
        forgetting_frequency: 10
    - exploration.OnResetExplorationWrapper:
        full_reset_frequency: 1
        jitter: 0
    - episode_stats.EpisodeStatsWrapper: {}


# =============================================================================
# Rewards (train CLI에서 선택)
# =============================================================================
rewards:
  baseline.ObjectRewardRequiredEventsMapIdsFieldMoves:
    reward:
      # Reward machine (3단계: 무음 전이 / rm_intermediate / rm_*_success)
      rm_enabled: true
      rm_max_transitions_per_step: 3
      rm_intermediate: 0.5             # Cut/Surf/Flash 공통: 메뉴 체인 중간 전이 보상 기본값 (키별 override 가능)
      rm_clawback_intermediate_on_abort: true
      rm_clawback_fraction: 0.9
      hm_supervision_proactive: false    # true면 타일만 봐도 surf 라벨 (CE 100% 붕괴)
      hm_supervision_latch_steps: 8      # RM hm_target 없을 때 라벨 유지

      rm_cut_success: 3.1
      rm_surf_success: 2.1
      rm_flash_success: 1.5
      # 선택: 키별 중간 보상 (없으면 rm_intermediate)
      # rm_surf_menu_open: 0.35
      # rm_surf_party_menu: 0.25
      # rm_surf_mon_selected: 0.35

      # Shaping / penalties
      step_penalty: 0.0
      unnecessary_hm_usage_penalty: 0.02


# =============================================================================
# Policies (train CLI에서 선택)
# =============================================================================
policies:
  multi_convolutional.MultiConvolutionalPolicy:
    policy:
      hidden_size: 512
      hm_latent_size: 256
      rm_state_embedding_dim: 4
      hm_hidden_size: 128
      hm_feature_alpha_init: 0.1
      hm_action_beta_init: 0.1
      hm_menu_action_beta_init: 0.08
    rnn:
      name: MultiConvolutionalRNN
      args:
        input_size: 512
        hidden_size: 512
        num_layers: 1


# =============================================================================
# Profiles (train --profile <name> 시 env/train 덮어씀, debug보다 먼저)
# =============================================================================
profiles:
  # 디스크·save_state 부담 줄임 (SPS는 주로 PyBoy tick·num_envs)
  train_fast:
    env:
      save_video: false
      n_record: 0
      save_state: false
    train:
      save_checkpoint: false

  # rm_intermediate만 더 크게 (메뉴 탐험 유도)
  train_more_rm_intermediate:
    rewards:
      baseline.ObjectRewardRequiredEventsMapIdsFieldMoves:
        reward:
          rm_intermediate: 0.35


# =============================================================================
# Debug overrides (train --debug 시 env/train 위 값 덮어씀)
# =============================================================================
debug:
  env:
    # runtime
    headless: false
    init_state: training3
    state_dir: pyboy_states
    max_steps: 19000
    log_frequency: 1
    disable_ai_actions: true
    animate_scripts: true
    save_state: false
    # observation
    use_global_map: false
    reduce_res: true
    two_bit: false
    # video
    save_video: true
    fast_video: false
    video_tail_steps: 2000
    # wild / QoL
    disable_wild_encounters: true
    auto_flash: false
    auto_remove_all_nonuseful_items: false
    auto_next_elevator_floor: false
    insert_saffron_guard_drinks: false
    infinite_health: true
    perfect_ivs: false
    # HM automation
    auto_teach_cut: false
    auto_use_cut: false
    auto_teach_surf: false
    auto_use_surf: false
    auto_teach_strength: false
    auto_use_strength: false
    auto_solve_strength_puzzles: false

  train:
    device: cpu
    compile: false
    compile_mode: default
    num_envs: 1
    envs_per_worker: 1
    num_workers: 1
    env_batch_size: 128
    zero_copy: false
    batch_size: 1024
    minibatch_size: 128
    batch_rows: 4
    bptt_horizon: 2
    total_timesteps: 1_000_000
    save_checkpoint: true
    checkpoint_interval: 4
    verbose: true
    env_pool: false
    load_optimizer_state: false
    async_wrapper: false
    sqlite_wrapper: false
    archive_states: false
